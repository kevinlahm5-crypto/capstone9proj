name: Deploy via OIDC

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264787847442:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Deploy sample artifact to S3
        run: |
          echo "Deployed by GitHub Actions via OIDC on $(date)" > deploy-proof.txt
          aws s3 cp deploy-proof.txt s3://capstone9-org-cloudtrail-264787847442/deploy-proof.txt
